[versions]
androidx-activityCompose = "1.8.2"
androidx-appcompat = "1.6.1"
androidx-navigationCompose = "2.7.7"
androidx-room = "2.6.1"
compose-plugin = "1.6.2" # Ensure this is a valid version
kotlin = "1.9.22" # Ensure this is a valid version
kotlinx-coroutines = "1.7.3"
ksp = "1.9.22-1.0.17" # Make sure this matches your Kotlin version
android-compileSdk = "34"
android-minSdk = "24"
android-targetSdk = "34"
android-gradlePlugin = "8.2.2"
kotlinx-datetime = "0.6.0"
androidx-sqlite = "2.4.0"
# Test library versions
kotlin-test = "1.9.22" # Should match kotlin version
junit = "4.13.2"
androidx-compose-ui-test = "1.6.7"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigationCompose" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidx-room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "androidx-room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidx-room" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" } # Assuming this is for Android debug
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# Corrected aliases for previously problematic and new test libraries
kotlinxDatetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
androidxSqliteDriver = { module = "androidx.sqlite:sqlite-driver", version.ref = "androidx-sqlite" }
kotlinTestCommon = { module = "org.jetbrains.kotlin:kotlin-test-common", version.ref = "kotlin-test" }
kotlinTestJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin-test" }
junit = { module = "junit:junit", version.ref = "junit" }
androidxComposeUiTestJunit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidx-compose-ui-test" }


[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradlePlugin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
